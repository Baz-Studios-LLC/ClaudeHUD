appId: com.bazstudios.claudehud
productName: ClaudeHUD
directories:
  output: dist
files:
  - main.js
  - game-capture.js
  - preload.js
  - renderer.js
  - message-format.js
  - claude-service.js
  - attachment-store.js
  - desktop-pins.js
  - platform-paths.js
  - context-usage.js
  - preferences.js
  - updater.js
  - index.html
  - style.css
  - icon.png
  - assets/app-icon.png
  - assets/tray-icon.png
  - package.json
asar: true
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  icon: assets/app-icon.png
  identity: '-'
  hardenedRuntime: false
  artifactName: ClaudeHUD-${version}-mac-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/app-icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ClaudeHUD
artifactName: ClaudeHUD-Setup-${version}.${ext}
publish:
  provider: github
  owner: Baz-Studios-LLC
  repo: ClaudeHUD
  releaseType: release
