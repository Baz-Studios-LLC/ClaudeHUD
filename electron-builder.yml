appId: com.bazstudios.claudehud
productName: ClaudeHUD
directories:
  output: dist
files:
  - main.js
  - game-capture.js
  - preload.js
  - renderer.js
  - message-format.js
  - claude-service.js
  - context-usage.js
  - preferences.js
  - updater.js
  - index.html
  - style.css
  - icon.png
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ClaudeHUD
artifactName: ClaudeHUD-Setup-${version}.${ext}
publish:
  provider: github
  owner: Baz-Studios-LLC
  repo: ClaudeHUD
  releaseType: release
